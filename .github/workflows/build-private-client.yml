name: Build private AgentRouter macOS client

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build channel
        required: true
        type: choice
        default: unsigned-probe
        options:
          - unsigned-probe
          - production-release
      source_sha:
        description: Immutable 40-character commit from the private Client repository
        required: true
        type: string
        default: b1b36f90247bec7a3dfb0de597d377d1d2112997
      client_version:
        description: Expected package version at the selected commit
        required: true
        type: string
        default: 0.1.91

permissions:
  contents: read

concurrency:
  group: macos-private-client-${{ inputs.mode }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ inputs.mode }} / ${{ inputs.client_version }} / ${{ inputs.source_sha }}
    runs-on: macos-14
    timeout-minutes: 120
    environment:
      name: ${{ inputs.mode == 'production-release' && 'production-signing' || 'unsigned-probe' }}
    env:
      PACKAGING_MODE: ${{ inputs.mode }}
      SOURCE_PATH: private-client
      PRIVATE_OUTPUT_ROOT: artifacts/private
      PUBLIC_OUTPUT_ROOT: public-artifacts

    steps:
      - name: Checkout immutable build shell
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate immutable inputs and carrier identity
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CLIENT_VERSION: ${{ inputs.client_version }}
        run: |
          set -euo pipefail
          [[ "$PACKAGING_MODE" == "unsigned-probe" || "$PACKAGING_MODE" == "production-release" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CLIENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = "Maybank01/agentrouter-macos-build-shell"

      - name: Preflight protected production credentials
        if: ${{ inputs.mode == 'production-release' }}
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bash scripts/preflight_production_signing.sh

      - name: Checkout exact private Client source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Maybank01/agentrouter-client-packaging
          ref: ${{ inputs.source_sha }}
          path: private-client
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify private checkout identity and remove remote
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git -C "$SOURCE_PATH" rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$SOURCE_SHA"
          git -C "$SOURCE_PATH" remote set-url origin disabled-private-origin

      - name: Show public runner environment
        shell: bash
        run: |
          sw_vers
          xcodebuild -version
          uname -a

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: private-client/package-lock.json

      - name: Setup Rust universal targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build private source without printing private compiler logs
        id: private_build
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CLIENT_VERSION: ${{ inputs.client_version }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -u
          mkdir -p "$PRIVATE_OUTPUT_ROOT"
          set +e
          bash scripts/build_private_client.sh \
            "$SOURCE_PATH" \
            "$PRIVATE_OUTPUT_ROOT" \
            "$SOURCE_SHA" \
            "$CLIENT_VERSION" \
            "$PACKAGING_MODE" \
            "$GITHUB_SHA" \
            > "$PRIVATE_OUTPUT_ROOT/build.log" 2>&1
          BUILD_STATUS=$?
          set -e
          echo "status=$BUILD_STATUS" >> "$GITHUB_OUTPUT"
          if [[ "$BUILD_STATUS" -eq 0 ]]; then
            echo "Private Client $PACKAGING_MODE completed; output will be uploaded only in encrypted form."
          else
            echo "::error::Private Client $PACKAGING_MODE failed with exit code $BUILD_STATUS. Download and decrypt the evidence artifact for the private log."
          fi

      - name: Remove temporary production signing material
        if: ${{ always() && inputs.mode == 'production-release' }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/agentrouter-client-build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Encrypt private build output
        if: always()
        shell: bash
        env:
          ARTIFACT_ENCRYPTION_KEY: ${{ secrets.ARTIFACT_ENCRYPTION_KEY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CLIENT_VERSION: ${{ inputs.client_version }}
          BUILD_STATUS: ${{ steps.private_build.outputs.status || '255' }}
        run: |
          bash scripts/encrypt_private_artifact.sh \
            "$PRIVATE_OUTPUT_ROOT" \
            "$PUBLIC_OUTPUT_ROOT" \
            "$SOURCE_SHA" \
            "$CLIENT_VERSION" \
            "$PACKAGING_MODE" \
            "$BUILD_STATUS" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_SHA"

      - name: Upload encrypted evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentrouter-macos-${{ inputs.mode }}-${{ inputs.client_version }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          path: public-artifacts/

      - name: Enforce pipeline result
        if: always()
        shell: bash
        env:
          BUILD_STATUS: ${{ steps.private_build.outputs.status || '255' }}
        run: test "$BUILD_STATUS" -eq 0
